# NOTE: Media player only (no microphone, no Assist): rock stable, native ESPHome i2s_audio, Sendspin

substitutions:
  name: "onju-voice"
  friendly_name: "Onju Voice Common Code"
  project_version: "1.2.0"
  device_description: "Common code for the onju voice, to be included in all onju voice devices"
  mute_sound_url: "sounds/mute.flac" # https://github.com/esphome/home-assistant-voice-pe/blob/dev/sounds/jack_disconnected.flac
  unmute_sound_url: "sounds/unmute.flac" # https://github.com/esphome/home-assistant-voice-pe/blob/dev/sounds/jack_connected.flac
  alarm_sound_url: "sounds/alarm_8s.flac" # https://freesound.org/people/JW_Audio/sounds/828581/
  # Sounds: the files of this repository (sounds/, credits in sounds/CREDITS.md), paths relative to the config folder. Override a substitution with another path or an http(s) URL to use other sounds.
  # NOTE for sounds: all sound were converted to flac, mono, 48khz (match the speaker sample_rate!), highest compression -> so they are as small as possible

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  min_version: 2026.7.0
  name_add_mac_suffix: true
  project:
    name: rmeissn.onju-voice-esphome
    version: "${project_version}"
  on_boot:
    then:
      - light.turn_on:
          id: top_led
          effect: booting
          red: 0%
          green: 0%
          blue: 100%
      - wait_until:
          condition:
            wifi.connected:
          timeout: 20s
      - light.turn_on:
          id: top_led
          effect: booting
          red: 0%
          green: 100%
          blue: 100%
      - wait_until:
          condition:
            api.connected:
          timeout: 20s
      - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1s
      - lambda: id(booted) = true;
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      #CONFIG_SPIRAM_RODATA: "y"
      #CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

      CONFIG_ESP_WIFI_EXTRA_IRAM_OPT: "y"

      # CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      # CONFIG_FREERTOS_HZ: "1000"             # 1ms FreeRTOS tick rate, to be tested

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false # The Onju has PSRAM (8MB octal), so this is safe. Allows configuring WiFi driver to use more resources (done automatically by the speaker media player)

# Enable logging
logger:
  # level: debug
  baud_rate: 0
  # initial_level: debug
  # logs:
  #  sensor: WARN

wifi:
  id: wifi_id
  ssid: to_be_overwritten
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: controle_leds
    - script.stop: ble_enable_delayed
    - delay: 5s # gives time for the Improv result to be transmitted (as in the Voice PE)
    - if: # a disconnect within these 5s must not leave BLE off
        condition:
          wifi.connected:
        then:
          - ble.disable:
  on_disconnect:
    - script.execute: ble_enable_delayed # Improv BLE available again while WiFi stays lost

# Improv via BLE (like the Voice PE factory firmware): WiFi setup from the HA app / improv-wifi.com.
# Starts only after 90s without WiFi (improv_ble wifi_timeout, same time as the fallback AP); BLE is disabled 5s after
# connecting and re-enabled after 60s without WiFi (not on short dropouts). The center touch button authorizes the setup.
esp32_ble:
  use_psram: true # BLE stack memory in PSRAM where possible

improv_ble: # formerly esp32_improv (alias removed in ESPHome 2027.4.0)
  authorizer: action # center touch button
  on_start:
    - lambda: id(improv_ble_in_progress) = true;
    - script.execute: controle_leds
  on_provisioned:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: controle_leds
  on_stop:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: controle_leds

captive_portal:

network:
  enable_ipv6: true

api:
  id: api_id

globals:
  - id: booted
    type: bool
    restore_value: false
  - id: led_state
    type: std::string
    restore_value: no
    initial_value: '"booting"'
  - id: old_volume_level
    type: float
    restore_value: no
    initial_value: "0.5"
  - id: wifi_error_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: api_error_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: improv_ble_in_progress # Improv BLE setup running, shown by the LEDs
    type: bool
    restore_value: no
    initial_value: "false"

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: return id(booted);
          then:
            # Check WiFi status
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - lambda: id(wifi_error_count) += 1;
                else:
                  - lambda: id(wifi_error_count) = 0;
            # Check HA API status
            - if:
                condition:
                  not:
                    api.connected:
                then:
                  - lambda: id(api_error_count) += 1;
                else:
                  - lambda: id(api_error_count) = 0;

            # WiFi loss > 10s (5 counts @ 2s) OR HA API loss > 30s (15 counts @ 2s) triggers error state
            - if:
                condition:
                  lambda: return (id(wifi_error_count) >= 5 || id(api_error_count) >= 15);
                then:
                  - if:
                      condition:
                        lambda: return id(led_state) != "connection_error";
                      then:
                        - logger.log:
                            level: WARN
                            format: "Connection error! WiFi: %s (Error-Count %d), API: %s (Error-Count %d)"
                            args:
                              [
                                'id(wifi_id).is_connected() ? "Connected" : "Disconnected"',
                                "id(wifi_error_count)",
                                'id(api_id).is_connected() ? "Connected" : "Disconnected"',
                                "id(api_error_count)",
                              ]
                        - if:
                            condition:
                              lambda: return id(show_connection_error_led_switch).state && !id(alarm_siren).state; # keep the siren's strobe LED
                            then:
                              - lambda: id(led_state) = "connection_error";
                              - script.execute: controle_leds
                else:
                  - if:
                      condition:
                        lambda: return id(led_state) == "connection_error";
                      then:
                        - logger.log: "Connection recovered! Resetting LED state to idle."
                        - lambda: id(led_state) = "idle";
                        - script.execute: controle_leds

i2s_audio:
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO13 # WS / LRCLK
    i2s_bclk_pin: GPIO18 # SCK / BCLK

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    dac_type: external
    channel: mono
    sample_rate: 48000 # DAC supports 8kHz to 96kHz
    bits_per_sample: 32bit # DAC supports 16/24/32 bit
    # no use_apll: the ESP32-S3 has no APLL, ESPHome silently ignored it (always PLL 160MHz)
    i2s_mode: primary
    i2s_audio_id: i2s_speaker
    i2s_dout_pin: GPIO12 # SDO / Din
    buffer_duration: 150ms # increased from 100ms to prevent audio from cutting of on e.g. network issues
    timeout: never

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

# On-device sounds, played via media_url "audio-file://<id>"
audio_file:
  - id: mute
    file: ${mute_sound_url}
  - id: unmute
    file: ${unmute_sound_url}
  - id: alarm_siren_sound # on-device, so the siren also works without HA; needs the 16MB partition table (docs/PARTITION_MIGRATION.md)
    file: ${alarm_sound_url}

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_file # on-device files on the media pipeline (the alarm siren)
    id: audio_file_media_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 65536 # reduced from 250KB to 64KB for an immediate announcement start
  - platform: audio_http
    id: http_media_source
    buffer_size: 131072 # reduced from 500KB to 128KB for a stream start below 1s
  - platform: sendspin
    id: sendspin_media_source
    decode_memory: internal
    #fixed_delay: 480 microseconds

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    announcement_pipeline:
      format: OPUS # FLAC is the least processor intensive codec, OPUS for fighting wifi instability
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      format: OPUS # FLAC is the least processor intensive codec, OPUS for fighting wifi instability
      num_channels: 1
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - audio_file_media_source
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0
    volume_max: 1
    on_state:
      then:
        - lambda: |-
            static float old_volume = -1;
            float new_volume = id(external_media_player).volume;
            if(abs(new_volume-old_volume) > 0.0001) {
              if(old_volume != -1) {
                if(!id(alarm_siren).state) {
                  bool is_button = id(volume_down).state || id(volume_up).state;
                  if (is_button || id(show_remote_volume_led_switch).state) {
                    id(show_volume)->execute();
                  }
                }
              }
            }
            old_volume = new_volume;
        - if:
            condition:
              - not:
                  media_player.is_announcing: external_media_player
            then:
              - mixer_speaker.apply_ducking:
                  id: media_mixing_input
                  decibel_reduction: 0
                  duration: 1.0s
    on_announcement:
      - logger.log: "On Announce"
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_play:
      - logger.log: "On Play"
      - if:
          condition:
            not:
              script.is_running: show_volume
          then:
            - script.execute: controle_leds
    on_pause:
      - logger.log: "On Pause"
      - if:
          condition:
            and:
              - not:
                  switch.is_on: alarm_siren
          then:
            - if:
                condition:
                  not:
                    script.is_running: show_volume
                then:
                  - lambda: id(led_state) = "idle";
                  - script.execute: controle_leds
    on_idle: # also called after announcement finished, is triggered on volume change
      - logger.log: "On IDLE"
      - if:
          condition:
            and:
              - not:
                  switch.is_on: alarm_siren
          then:
            - if:
                condition:
                  not:
                    script.is_running: show_volume
                then:
                  - lambda: id(led_state) = "idle";
                  - script.execute: controle_leds

esp32_touch:
  setup_mode: false
  sleep_duration: 500us
  measurement_duration: 250us
  low_voltage_reference: 0.8V
  high_voltage_reference: 2.4V

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: esp32_touch
    id: volume_down
    pin: GPIO4
    name: "VOL-"
    icon: mdi:volume-minus
    entity_category: diagnostic
    disabled_by_default: true
    threshold: 2000 # 1000 to 3000 should be a good value (lower = more sensitive)
    on_press:
      then:
        - light.turn_on: left_led
        - script.execute:
            id: set_volume
            volume: -0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_down
            then:
              - script.execute:
                  id: set_volume
                  volume: -0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: left_led

  - platform: esp32_touch
    id: volume_up
    pin: GPIO2
    name: "VOL+"
    icon: mdi:volume-plus
    entity_category: diagnostic
    disabled_by_default: true
    threshold: 2000 # 1000 to 3000 should be a good value (lower = more sensitive)
    on_press:
      then:
        - light.turn_on: right_led
        - script.execute:
            id: set_volume
            volume: 0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_up
            then:
              - script.execute:
                  id: set_volume
                  volume: 0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: right_led

  - platform: esp32_touch
    id: action
    pin: GPIO3
    threshold: 2000 # 1000 to 3000 should be a good value (lower = more sensitive)
    on_multi_click:
      - timing: # single click
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          # NOTE the alarm siren deliberately cannot be stopped with the button (too easy for an intruder)
          - if: # switch between pause/play
              condition:
                or:
                  - media_player.is_playing:
                      id: external_media_player
                  - media_player.is_paused:
                      id: external_media_player
                  - media_player.is_idle:
                      id: external_media_player
              then:
                - media_player.toggle:
                    id: external_media_player
      - timing: # double click
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at least 0.25s
        then:
          - event.trigger:
              id: button_press_event
              event_type: "double_press"
      - timing: # triple click
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at least 0.25s
        then:
          - event.trigger:
              id: button_press_event
              event_type: "triple_press"
          - light.turn_on:
              id: top_led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 100%
              effect: pulse
          - media_player.stop:
              id: external_media_player
          - media_player.stop:
              id: sendspin_group_media_player
          - wait_until:
              condition:
                not:
                  speaker.is_playing:
                    id: i2s_audio_speaker
              timeout: 3s
          - if: # the siren keeps ringing (its loop restarts it): keep its strobe LED
              condition:
                switch.is_off: alarm_siren
              then:
                - lambda: id(led_state) = "idle";
          - script.execute: controle_leds
      - timing: # long press
          - ON for 1s to 3s
          - OFF for at least 0.25s
        then:
          - event.trigger:
              id: button_press_event
              event_type: "long_press"

  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
    icon: mdi:microphone-message-off
    name: "Muted (Hardware Switch)"
    on_press:
      - if:
          condition:
            - switch.is_off: master_mute_switch
          then:
            - media_player.play_media:
                id: external_media_player
                media_url: audio-file://mute
                announcement: true
            - wait_until:
                condition:
                  speaker.is_playing:
                    id: announcement_resampling_speaker
                timeout: 2s
            - wait_until:
                condition:
                  not:
                    speaker.is_playing:
                      id: announcement_resampling_speaker
                timeout: 3s
    on_release:
      - media_player.play_media:
          id: external_media_player
          media_url: audio-file://unmute
          announcement: true
      - wait_until:
          condition:
            speaker.is_playing:
              id: announcement_resampling_speaker
          timeout: 2s
      - wait_until:
          condition:
            not:
              speaker.is_playing:
                id: announcement_resampling_speaker
          timeout: 3s
      - delay: 100ms
      - switch.turn_off: master_mute_switch

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    disabled_by_default: true
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    disabled_by_default: true

number:
  # Volume of the alarm siren (media player volume while it rings).
  - platform: template
    name: "Alarm volume"
    id: alarm_volume
    icon: mdi:volume-high
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 100
    restore_value: false
    optimistic: true
    on_value:
      - if:
          condition:
            switch.is_on: alarm_siren
          then:
            - media_player.volume_set:
                id: external_media_player
                volume: !lambda return x / 100.0f;

debug:
text_sensor:
  - platform: debug
    reset_reason:
      name: "Restart Reason"
      disabled_by_default: true

event:
  # Event entity exposed to the user to automate on complex center button presses.
  # The simple press is not exposed as it is used to control the device itself.
  - platform: template
    id: button_press_event
    name: "Button press"
    icon: mdi:button-pointer
    device_class: button
    event_types:
      - double_press
      - triple_press
      - long_press

light:
  - platform: esp32_rmt_led_strip
    id: leds
    pin: GPIO11
    chipset: SK6812
    num_leds: 6
    channel_colors: GRB # replaces the deprecated rgb_order (removed in 2027.3.0)
    default_transition_length: 0s
    gamma_correct: 2.8
  - platform: partition
    id: left_led
    segments:
      - id: leds
        from: 0
        to: 0
    default_transition_length: 100ms
  - platform: partition
    id: top_led
    segments:
      - id: leds
        from: 1
        to: 4
    default_transition_length: 100ms
    effects:
      - pulse:
          name: pulse
          transition_length: 250ms
          update_interval: 250ms
      - addressable_scan:
          name: booting
          move_interval: 100ms
          scan_width: 1
      - strobe:
          name: alarm_strobe
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 200ms
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 200ms
      - addressable_lambda:
          name: show_volume
          update_interval: 50ms
          lambda: |-
            int int_volume = int(id(external_media_player).volume * 100.0f * it.size());
            int full_leds = int_volume / 100;
            int last_brightness = int_volume % 100;
            int i = 0;
            for(; i < full_leds; i++) {
              it[i] = Color::WHITE;
            }
            if(i < 4) {
              it[i++] = Color(64, 64, 64).fade_to_white(last_brightness*256/100);
            }
            for(; i < it.size(); i++) {
              it[i] = Color(64, 64, 64);
            }
  - platform: partition
    id: right_led
    segments:
      - id: leds
        from: 5
        to: 5
    default_transition_length: 100ms

script:
  # Re-enables BLE for Improv only if WiFi stays lost (no BLE stack setup/teardown on every roam or short dropout)
  - id: ble_enable_delayed
    mode: restart
    then:
      - delay: 60s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - ble.enable:

  - id: controle_leds
    then:
      - if:
          condition:
            lambda: return id(booted);
          then:
            # Improv BLE setup wins over the other states (WiFi is down then, so connection_error is active too), except the alarm
            - if:
                condition:
                  lambda: return id(improv_ble_in_progress) && id(led_state) != "alarm";
                then:
                  - light.turn_on:
                      id: top_led
                      red: 100%
                      green: 89%
                      blue: 71%
                      effect: pulse
                else:
                  - if:
                      condition:
                        lambda: return id(led_state) == "idle";
                      then:
                        - if:
                            condition:
                              switch.is_on: master_mute_switch
                            then:
                              - light.turn_on:
                                  id: top_led
                                  red: 100%
                                  green: 0%
                                  blue: 5%
                                  brightness: 30%
                                  effect: "none"
                            else:
                              - light.turn_off:
                                  id: top_led
                  - if:
                      condition:
                        lambda: return id(led_state) == "error";
                      then:
                        - light.turn_on:
                            id: top_led
                            blue: 0%
                            red: 100%
                            green: 0%
                            effect: none
                  - if:
                      condition:
                        lambda: return id(led_state) == "connection_error";
                      then:
                        - light.turn_on:
                            id: top_led
                            red: 100%
                            green: 0%
                            blue: 0%
                            effect: pulse
                  - if:
                      condition:
                        lambda: return id(led_state) == "alarm";
                      then:
                        - light.turn_on:
                            id: top_led
                            effect: alarm_strobe

  - id: set_volume
    mode: restart
    parameters:
      volume: float
    then:
      - media_player.volume_set:
          id: external_media_player
          volume: !lambda return clamp(id(external_media_player).volume+volume, 0.0f, 1.0f);

  - id: show_volume
    mode: restart
    then:
      - light.turn_on:
          id: top_led
          effect: show_volume
      - delay: 1s
      - if:
          condition:
            - not:
                switch.is_on: alarm_siren
          then:
            - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

  - id: play_alarm_loop
    then:
      - while:
          condition:
            - switch.is_on: alarm_siren
          then:
            - media_player.play_media:
                id: external_media_player
                media_url: "audio-file://alarm_siren_sound"
            - wait_until:
                condition:
                  or:
                    - media_player.is_playing:
                        id: external_media_player
                    - media_player.is_announcing:
                        id: external_media_player
                timeout: 5s # playback start
            # an HA announcement during the siren reports ANNOUNCING, not PLAYING: wait for both to end
            - wait_until:
                condition:
                  not:
                    or:
                      - media_player.is_playing:
                          id: external_media_player
                      - media_player.is_announcing:
                          id: external_media_player
                timeout: 60s
            - delay: 50ms # short gap between repeats (alarm_8s.flac is the alarm without its trailing 1 s of silence)

switch:
  # This is the master mute switch. The user can only turn it on and off if the hardware switch is off. (The hardware switch overrides the software one)
  # Internal here: no microphone in this config, the lambda only mirrors the hardware switch (an HA toggle would snap back), it only drives the mute LED.
  - platform: template
    internal: true
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute Microphone
    entity_category: ""
    optimistic: true
    lambda: |-
      // Muted either if the hardware mute switch is on or the microphone's software mute switch is enabled
      if (id(hardware_mute_switch).state) {
        return true;
      } else {
        return false;
      }
    on_turn_on:
      - lambda: id(led_state) = "idle"; # idle handles checking the mute switch
      - script.execute: controle_leds
    on_turn_off:
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

  - platform: gpio
    id: dac_mute
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: True

  - platform: template
    name: "Alarm Siren"
    id: alarm_siren
    icon: mdi:alarm-light
    entity_category: ""
    optimistic: true
    restore_mode: ALWAYS_OFF # never restart the siren after a reboot/power loss
    on_turn_on:
      # Save volume
      - lambda: id(old_volume_level) = id(external_media_player).volume;
      - media_player.volume_set:
          id: external_media_player
          volume: !lambda return id(alarm_volume).state / 100.0f; # "Alarm volume", 100% after a reboot
      - script.execute: play_alarm_loop
      - lambda: id(led_state) = "alarm";
      - script.execute: controle_leds
      # Timeout 5 minutes
      # TODO known issue: re-triggering does not cancel a pending delay (each turn_on runs in parallel). If the siren is
      # turned on again within 5min, the first run's delay turns the new one off early.
      # Fix: move delay + turn_off into a script with mode: restart, execute it here and stop it in on_turn_off.
      - delay: 5min
      - switch.turn_off: alarm_siren
    on_turn_off:
      # stop the loop first, then the siren unconditionally (not PLAYING during an announcement or right after play_media)
      - script.stop: play_alarm_loop
      - media_player.stop:
          id: external_media_player
      - media_player.volume_set:
          id: external_media_player
          volume: !lambda return id(old_volume_level);
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

  - platform: template
    id: show_remote_volume_led_switch
    name: "LED bei Remote-Lautstaerke"
    icon: "mdi:volume-vibrate"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: show_connection_error_led_switch
    name: "Blinken bei Verbindungsfehler"
    icon: "mdi:wifi-alert"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
