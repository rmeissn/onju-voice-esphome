# use this file directly or copy the content into your own esphome yaml file and adjust the substitutions and packages as needed and per device
substitutions:
  name: "onju-voice"
  friendly_name: "Onju Voice Example Device"
  project_version: "1.3.0"
  device_description: "Onju Voice Satellite with ESPHome software and microWakeWord"
  # Sounds: the *_sound_url substitutions default to the files in sounds/ (credits: sounds/CREDITS.md). Override them to use
  # other sounds, e.g. the original wake sound: wakeup_sound_url: "sounds/wakeup.flac" with wake_listen_delay: 450ms. More in docs/SETUP_GUIDE.md, section 3.

packages:
  # choose one of the configs:
  - !include onju_duplex_i2s.yaml # mic and speaker at the same time, echo cancellation, Assist + Sendspin (tested on one device, see docs/AUDIO_INVESTIGATION.md)
  # - !include onju_media_player.yaml # media player only (no microphone, no Assist), Sendspin - rock stable
  # - !include onju_single_i2s.yaml # classic: mic and speaker share the bus alternately, ESPHome components only
  - !include wifi.yaml
  - !include ota.yaml

# Optional, saves IRAM: the device log shows "Set flash_chip: <vendor> ... to save IRAM" at boot; enter that vendor here.
# esp32:
#   framework:
#     advanced:
#       flash_chip: <vendor>
