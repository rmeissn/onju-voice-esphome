# NOTE: Works quite good, might need further tuning of gain and attenuation values

substitutions:
  name: "onju-voice"
  friendly_name: "Onju Voice Common Code"
  project_version: "1.3.0"
  device_description: "Common code for the onju voice, to be included in all onju voice devices"
  wakeup_sound_url: "http://192.168.0.202:8123/local/wakeup.flac" # New Notification #7 by UNIVERSFIELD https://freesound.org/people/UNIVERSFIELD/sounds/736267/
  error_sound_url: "http://192.168.0.202:8123/local/error.flac" # Error #8 by UNIVERSFIELD https://freesound.org/people/UNIVERSFIELD/sounds/734442/
  timer_finished_sound_url: "http://192.168.0.202:8123/local/timer_finished.flac" # New Notification #6 by UNIVERSFIELD https://freesound.org/people/UNIVERSFIELD/sounds/734445/
  mute_sound_url: "http://192.168.0.202:8123/local/mute.flac" # https://github.com/esphome/home-assistant-voice-pe/blob/dev/sounds/jack_disconnected.flac
  unmute_sound_url: "http://192.168.0.202:8123/local/unmute.flac" # https://github.com/esphome/home-assistant-voice-pe/blob/dev/sounds/jack_connected.flac
  knock_sound_url: "http://192.168.0.202:8123/local/knock.flac" # https://freesound.org/people/UberBosser/sounds/421585/
  click_sound_url: "http://192.168.0.202:8123/local/tongue-click.flac" # https://freesound.org/people/MichellePamelaLyons/sounds/135515/
  alarm_sound_url: "http://192.168.0.202:8123/local/alarm.flac" # https://freesound.org/people/JW_Audio/sounds/828581/
  # NOTE for sounds: all sound were converted to flac, mono, 48khz (match the speaker sample_rate!), highest compression -> so they are as small as possible

external_components:
  # Audio Stack 2026.11.0 requires ESPHome >= 2026.10.0 and uses ESPHome's own speaker, mixer, resampler,
  # media_player, voice_assistant and micro_wake_word (no overrides needed).
  - source: github://n-IA-hane/esphome-audio-stack@v2026.11.0
    components: [esp_audio_stack, esp_aec]
    refresh: 0s

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  min_version: 2026.10.0
  name_add_mac_suffix: true
  project:
    name: rmeissn.onju-voice-esphome
    version: "${project_version}"
  on_boot:
    then:
      - light.turn_on:
          id: top_led
          effect: booting
          red: 0%
          green: 0%
          blue: 100%
      - wait_until: # timeout: continue booting without WiFi, so the connection error check (needs booted) can run
          condition:
            wifi.connected:
          timeout: 20s
      - light.turn_on:
          id: top_led
          effect: booting
          red: 0%
          green: 100%
          blue: 100%
      - wait_until:
          condition:
            api.connected:
          timeout: 20s
      - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1s
      - lambda: id(booted) = true;
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      # ESP32-S3 profile recommended by esphome-audio-stack (docs: "PSRAM and sdkconfig Requirements")
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y" # not in the audio stack list, but used by the Voice PE with the same cache setup

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096" # allocations <= 4KB stay in internal RAM, larger ones may go to PSRAM

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" # TLS1.3 support isn't enabled by default in IDF 5.1.5

      CONFIG_ESP_WIFI_EXTRA_IRAM_OPT: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false # The Onju has PSRAM (8MB octal), so this is safe. Allows configuring WiFi driver to use more resources (done automatically by the speaker media player)

# Enable logging
logger:
  # level: debug
  baud_rate: 0
  # initial_level: debug
  # logs:
  #  sensor: WARN

wifi:
  id: wifi_id
  ssid: to_be_overwritten

captive_portal:

network:
  enable_ipv6: true

api:
  id: api_id
  actions:
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop

globals:
  - id: booted
    type: bool
    restore_value: false
  - id: internal_flicker
    type: bool
    restore_value: false
  - id: is_timer_active
    type: bool
    restore_value: false
  - id: led_state
    type: std::string
    restore_value: no
    initial_value: '"booting"'
  - id: old_volume_level
    type: float
    restore_value: no
    initial_value: "0.5"
  - id: wifi_error_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: api_error_count
    type: int
    restore_value: no
    initial_value: "0"

# Connection check (same as onju_media_player.yaml)
interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: return id(booted);
          then:
            # Check WiFi status
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - lambda: id(wifi_error_count) += 1;
                else:
                  - lambda: id(wifi_error_count) = 0;
            # Check HA API status
            - if:
                condition:
                  not:
                    api.connected:
                then:
                  - lambda: id(api_error_count) += 1;
                else:
                  - lambda: id(api_error_count) = 0;

            # WiFi loss > 10s (5 counts @ 2s) OR HA API loss > 30s (15 counts @ 2s) triggers error state
            - if:
                condition:
                  lambda: return (id(wifi_error_count) >= 5 || id(api_error_count) >= 15);
                then:
                  - if:
                      condition:
                        lambda: return id(led_state) != "connection_error";
                      then:
                        - logger.log:
                            level: WARN
                            format: "Connection error! WiFi: %s (Error-Count %d), API: %s (Error-Count %d)"
                            args:
                              [
                                'id(wifi_id).is_connected() ? "Connected" : "Disconnected"',
                                "id(wifi_error_count)",
                                'id(api_id).is_connected() ? "Connected" : "Disconnected"',
                                "id(api_error_count)",
                              ]
                        - if:
                            condition:
                              lambda: return id(show_connection_error_led_switch).state;
                            then:
                              - lambda: id(led_state) = "connection_error";
                              - script.execute: controle_leds
                else:
                  - if:
                      condition:
                        lambda: return id(led_state) == "connection_error";
                      then:
                        - logger.log: "Connection recovered! Resetting LED state to idle."
                        - lambda: id(led_state) = "idle";
                        - script.execute: controle_leds

# IDEA (not implemented yet): wake word watchdog
# Background: with Audio Stack 2026.7 the wake word stopped working after a while and only a reboot helped.
# Cause (from the 2026.7 code): any I2S error set a mic error status that was never cleared, so the mic never
# restarted and MWW got no audio anymore. Since 2026.11 the error is cleared once the audio path works again,
# but a failed session only restarts on the NEXT start request (mic or speaker). MWW keeps the mic open
# permanently and never requests a new start, so the mic may stay stopped until the next sound/music plays.
# Watchdog: an interval (e.g. 30s) checks use_wake_word on, master_mute_switch off, api.connected,
# voice_assistant not running and NOT microphone.is_capturing(i2s_mics) -> micro_wake_word.stop, short delay,
# micro_wake_word.start (the new mic start request restarts the failed audio session).
# Only needed if the log shows "I2S error detected in audio task" without a following "I2S audio path recovered".
micro_wake_word: # requires 16khz input currently
  id: mww
  microphone:
    microphone: i2s_mics # mww_microphone
    channels: 0
    gain_factor: 32 # TODO find optimal value, probably 8 to 16 if speaker is recorded, 32 to 64 if no speaker is active (or very quiete)
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
  vad:
  on_wake_word_detected:
    - if:
        condition:
          - switch.is_on: use_wake_word # ignore detection if switch is off
        then:
          - media_player.play_media:
              id: nabu
              media_url: "audio-file://wakeup"
              announcement: true
          # wait for the announcement path (not the hardware speaker, which keeps playing while music runs)
          - wait_until:
              condition:
                speaker.is_playing:
                  id: announcement_spk_resampling_input
              timeout: 2s
          - wait_until:
              condition:
                not:
                  speaker.is_playing:
                    id: announcement_spk_resampling_input
              timeout: 3s
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

number:
  # NOTE no master_volume number: Audio Stack then keeps its master volume at 100%, so the media player volume
  # is the only volume control (master volume and media player volume would be multiplied)
  - platform: esp_audio_stack
    esp_audio_stack_id: i2s_shared
    mic_gain: # NOTE since Audio Stack 2026.11.0 positive gain is a constant boost from the first sample (no level gate anymore) -> recheck saved values for clipping
      id: mic_gain
      name: Mic Gain
      min_value: -20
      max_value: 30

select:
  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Less slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
        } else if (x == "Less slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(192);    // ~0.75 -> ??? FAPH on DipCo
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
        }

esp_audio_stack:
  id: i2s_shared
  i2s_lrclk_pin: GPIO13 # WS / LRCLK (shared by mics and DAC)
  i2s_bclk_pin: GPIO18 # SCK / BCLK (shared by mics and DAC)
  i2s_din_pin: GPIO17 # mic data
  i2s_dout_pin: GPIO12 # SDO / Din of the DAC
  # DAC supports 8kHz to 96kHz, but Audio Stack accepts 8kHz to 48kHz on the bus.
  # sample_rate must be an integer multiple (max x6) of output_sample_rate -> 44.1kHz (would be enough) is not possible with a 16kHz mic
  sample_rate: 48000
  output_sample_rate: 16000 # Mic/AEC/MWW/VA converted from 48kHz to 16kHz (ratio 3, Espressif esp_ae_rate_cvt)
  processor_id: aec_processor
  # Onju has no hardware loopback (MEMS mics + I2S amp, no codec) -> software playback reference.
  # ring_buffer is recommended for this setup. With 2026.7 it did not work for me, so previous_frame was used;
  # since 2026.11 the ring is fed every TX period (incl. silence/padding/underruns) like previous_frame. Fallback: previous_frame
  aec_reference: ring_buffer
  aec_reference_buffer_ms: 80 # ring capacity, not a fixed delay
  slot_bit_width: 32 # SPH0645 needs 32-bit I2S frames
  correct_dc_offset: true # removes DC bias from SPH0645 MEMS mics
  # Both mics (left + right slot on the shared data line) averaged to mono before the AEC (new in 2026.11.0, cf. examples/05-stereo-i2s-downmix.yaml)
  # NOTE the old stereo capture made the mics quieter and destroyed the SNR (1-2db vs. ~16db with one mic). TODO: retest with mic_mix: average
  # If one slot turns out to be silent/noisy, averaging halves the level (-6db) -> fall back to a single mic:
  # remove rx_mic_slots + mic_mix and set mic_channel: left (or right)
  rx_slot_mode: stereo
  rx_mic_slots: [left, right]
  mic_mix: average
  # NOTE num_channels only describes the TX (speaker) bus, it does NOT enable stereo capture.
  buffers_in_psram: true # optional: moves non-DMA audio buffers to PSRAM, saves internal RAM (useful with Sendspin + HTTP buffers)

esp_aec:
  id: aec_processor
  sample_rate: 16000 # AEC is always at 16kHz (= output_sample_rate)
  # Modes that preserve wake word features (linear speech-recognition AEC, no non-linear residual suppression):
  #   sr_low_cost  - recommended starting point for VA + MWW
  #   sr_high_perf - higher-cost SR/FFT variant, needs a large contiguous DMA-capable internal heap block (rejected at runtime if missing)
  # fd_low_cost/fd_high_perf and voip_low_cost/voip_high_perf add residual echo suppression (better for calls, may hurt wake word detection)
  mode: sr_low_cost
  filter_length: 4 # ESP-SR echo filter length (1-8, not ms): higher tracks longer echo tails but costs more CPU/RAM

speaker:
  # Hardware speaker output
  - platform: esp_audio_stack
    id: onju_out
    esp_audio_stack_id: i2s_shared
    sample_rate: 48000 # DAC supports 8kHz to 96kHz; must equal esp_audio_stack.sample_rate (validated since 2026.11.0)
    bits_per_sample: 16 # DAC supports 16/24/32 bit, but the public speaker PCM of Audio Stack is always 16 bit

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: onju_out
    num_channels: 1
    # task_stack_in_psram: true
    source_speakers:
      - id: announcement_spk_mixer_input
        timeout: 10s
        buffer_duration: 500ms
      - id: media_spk_mixer_input
        timeout: 10s
        buffer_duration: 500ms

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1
    # task_stack_in_psram: true
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1
    # task_stack_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: i2s_mics
    esp_audio_stack_id: i2s_shared

# Sendspin (Music Assistant) hub, provides synchronized multi-room playback
sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

# On-device sounds, played via media_url "audio-file://<id>"
audio_file:
  - id: wakeup
    file: "${wakeup_sound_url}"
  - id: error
    file: "${error_sound_url}"
  - id: mute
    file: "${mute_sound_url}"
  - id: unmute
    file: "${unmute_sound_url}"
  - id: timer_finished
    file: "${timer_finished_sound_url}"

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http # TTS responses, announcements from HA
    id: http_announcement_source
    buffer_size: 65536 # von 250KB auf 64KB reduziert für sofortigen Durchsage-Start (same as onju_media_player.yaml)
  - platform: audio_http # media from HA / URLs (e.g. the alarm sound)
    id: http_media_source
    buffer_size: 131072 # von 500KB auf 128KB reduziert für <1s Stream-Start (same as onju_media_player.yaml)
  - platform: sendspin
    id: sendspin_media_source

media_player:
  # Exposes the Sendspin group controls (Music Assistant)
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    name: "Media Player"
    id: nabu
    volume_increment: 0.05
    volume_min: 0
    volume_max: 1
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      format: FLAC # FLAC is the least processor intensive codec (CPU is shared with AEC + MWW)
      num_channels: 1
      sample_rate: 48000
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      speaker: media_spk_resampling_input
      format: FLAC # FLAC is the least processor intensive codec (CPU is shared with AEC + MWW)
      num_channels: 1
      sample_rate: 48000
      sources:
        - http_media_source
        - sendspin_media_source
    on_state:
      then:
        - lambda: |-
            static float old_volume = -1;
            float new_volume = id(nabu).volume;
            if(abs(new_volume-old_volume) > 0.0001) {
              if(old_volume != -1) {
                if(!id(timer_ringing).state && !id(alarm_siren).state) {
                  // always show volume changes from the touch buttons, remote changes (HA/MA) only if enabled
                  bool is_button = id(volume_down).state || id(volume_up).state;
                  if (is_button || id(show_remote_volume_led_switch).state) {
                    id(show_volume)->execute();
                  }
                }
              }
            }
            old_volume = new_volume;
        # Announcement finished -> stop ducking (Assist and the ringing timer manage their own ducking)
        - if:
            condition:
              and:
                - not:
                    media_player.is_announcing: nabu
                - not: voice_assistant.is_running
                - not:
                    switch.is_on: timer_ringing
            then:
              - mixer_speaker.apply_ducking:
                  id: media_spk_mixer_input
                  decibel_reduction: 0
                  duration: 1.0s
    on_announcement:
      - logger.log: "On Announce"
      # HA announcements (tts.speak, assist_satellite.announce, ...): music only quieter
      # (not during Assist, which may have the music practically off for speech input)
      - if:
          condition:
            and:
              - not: voice_assistant.is_running
              - not:
                  switch.is_on: timer_ringing
          then:
            - mixer_speaker.apply_ducking:
                id: media_spk_mixer_input
                decibel_reduction: 20
                duration: 0.0s
    on_play:
      - logger.log: "On Play"
      - lambda: id(internal_flicker) = false; # needed to deactivate flicker on audio playback
      - if:
          condition:
            not:
              script.is_running: show_volume
          then:
            - script.execute: controle_leds
    on_pause:
      - logger.log: "On Pause"
      - if:
          condition:
            and:
              - not:
                  switch.is_on: alarm_siren
              - not:
                  switch.is_on: timer_ringing
          then:
            - lambda: id(internal_flicker) = true; # activated flicker on pause
            - if:
                condition:
                  and:
                    - not:
                        script.is_running: show_volume
                    - not: voice_assistant.is_running
                then:
                  - lambda: id(led_state) = "idle";
                  - script.execute: controle_leds
      # - micro_wake_word.start
    on_idle: # also called after announcement finished, is triggered on volume change
      - logger.log: "On IDLE"
      - if:
          condition:
            and:
              - not:
                  switch.is_on: alarm_siren
              - not:
                  switch.is_on: timer_ringing
          then:
            - lambda: id(internal_flicker) = true; # needed to activate flicker on idle
            - if:
                condition:
                  and:
                    - not:
                        script.is_running: show_volume
                    - not: voice_assistant.is_running
                then:
                  - lambda: id(led_state) = "idle";
                  - script.execute: controle_leds
      # - micro_wake_word.start

voice_assistant: # need to use a 16khz due to mww
  id: va
  microphone:
    microphone: i2s_mics # onju_microphone
    channels: 0
    gain_factor: 32 # TODO find optimal value, probably 8 to 16 if speaker is recorded, 32 to 64 if no speaker is active (or very quiete)
  media_player: nabu
  micro_wake_word: mww
  use_wake_word: false
  # For the following three options: speculative tuning based on input audio, as I can't get the resulting file to analyse
  noise_suppression_level: 2
  auto_gain: 10 dbfs
  volume_multiplier: 1.0
  # Ducking of the music (media pipeline) during Assist:
  #   speech input (on_start until on_stt_vad_end): practically off (255 dB, max since ESPHome 2026.10)
  #   thinking/reply (on_stt_vad_end / on_tts_start): 20 dB quieter
  #   on_end: back to normal (unless a timer rings)
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_spk_mixer_input
        decibel_reduction: 255 # Number of dB quieter; higher implies more quiet, 0 implies full volume -> practically off while the mic records speech
        duration: 0.0s # The duration of the transition (default is no transition) -> duck now
  on_listening:
    - lambda: id(led_state) = "listening";
    - script.execute: controle_leds
  on_stt_vad_end:
    - lambda: id(led_state) = "thinking";
    - script.execute: controle_leds
    - mixer_speaker.apply_ducking: # speech input finished -> music only quieter
        id: media_spk_mixer_input
        decibel_reduction: 20
        duration: 0.5s
  on_tts_start: # fallback if no VAD end event was sent (e.g. speech ended by timeout)
    - mixer_speaker.apply_ducking:
        id: media_spk_mixer_input
        decibel_reduction: 20
        duration: 0.5s
  on_tts_end:
    - lambda: id(led_state) = "replying";
    - script.execute: controle_leds
  on_idle:
    - logger.log: "voice assist idle"
  on_end:
    - logger.log: "calling on end"
    - wait_until:
        condition:
          - media_player.is_announcing: nabu
        timeout: 0.5s
    - wait_until:
        condition:
          not:
            media_player.is_announcing: nabu
        timeout: 60s # long TTS answers
    - if:
        condition:
          not:
            switch.is_on: timer_ringing # the ringing timer keeps its own ducking
        then:
          - mixer_speaker.apply_ducking: # Stop ducking audio
              id: media_spk_mixer_input
              decibel_reduction: 0
              duration: 1.0s
    - lambda: id(led_state) = "idle";
    - script.execute: controle_leds
    - if:
        condition:
          and:
            - switch.is_on: use_wake_word
            - switch.is_off: master_mute_switch
            - not:
                media_player.is_playing: nabu
        then:
          - micro_wake_word.start:
  on_client_connected:
    - if:
        condition:
          and:
            - switch.is_on: use_wake_word
            - switch.is_off: master_mute_switch
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - if:
        condition:
          and:
            - switch.is_on: use_wake_word
            - switch.is_off: master_mute_switch
        then:
          - voice_assistant.stop:
          - micro_wake_word.stop:
  on_error:
    - media_player.play_media:
        id: nabu
        media_url: "audio-file://error"
        announcement: true
    - lambda: id(led_state) = "error";
    - script.execute: controle_leds
    - delay: 1s
    - lambda: id(led_state) = "idle";
    - script.execute: controle_leds
  on_timer_started:
    - lambda: id(led_state) = "idle";
    - script.execute: controle_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_cancelled:
    - lambda: id(led_state) = "idle";
    - script.execute: controle_leds
  on_timer_updated:
    - lambda: id(led_state) = "idle";
    - script.execute: controle_leds

esp32_touch:
  setup_mode: false
  sleep_duration: 500us
  measurement_duration: 250us
  low_voltage_reference: 0.8V
  high_voltage_reference: 2.4V
  #filter_mode: IIR_16
  #debounce_count: 2
  #noise_threshold: 3
  #jitter_step: 4
  #smooth_mode: IIR_4
  #denoise_grade: BIT8
  #denoise_cap_level: L0

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: esp32_touch
    id: volume_down
    pin: GPIO4
    name: "VOL-"
    icon: mdi:volume-minus
    disabled_by_default: true
    threshold: 2000 # 1000 to 3000 should be a good value (lower = more sensitive)
    on_press:
      then:
        - light.turn_on: left_led
        - script.execute:
            id: set_volume
            volume: -0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_down
            then:
              - script.execute:
                  id: set_volume
                  volume: -0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: left_led

  - platform: esp32_touch
    id: volume_up
    pin: GPIO2
    name: "VOL+"
    icon: mdi:volume-plus
    disabled_by_default: true
    threshold: 2000 # 1000 to 3000 should be a good value (lower = more sensitive)
    on_press:
      then:
        - light.turn_on: right_led
        - script.execute:
            id: set_volume
            volume: 0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_up
            then:
              - script.execute:
                  id: set_volume
                  volume: 0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: right_led

  - platform: esp32_touch
    id: action
    pin: GPIO3
    threshold: 2000 # 1000 to 3000 should be a good value (lower = more sensitive)
    on_multi_click:
      - timing: # single click
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      media_player.is_announcing:
                        id: nabu
                    then:
                      - media_player.stop:
                          id: nabu
                          announcement: true
                    else:
                      - if:
                          condition: voice_assistant.is_running
                          then:
                            - voice_assistant.stop
                          else:
                            - if: # switch between pause/play
                                condition:
                                  or:
                                    - media_player.is_playing:
                                        id: nabu
                                    - media_player.is_paused:
                                        id: nabu
                                then:
                                  - media_player.toggle:
                                      id: nabu
                                else:
                                  - if: # if not paused/playing, activate va
                                      condition:
                                        and:
                                          - not: voice_assistant.is_running
                                          - lambda: return id(booted);
                                          - not:
                                              switch.is_on: master_mute_switch
                                      then:
                                        - media_player.play_media:
                                            id: nabu
                                            media_url: "audio-file://wakeup"
                                            announcement: true
                                        - wait_until:
                                            condition:
                                              speaker.is_playing:
                                                id: announcement_spk_resampling_input
                                            timeout: 2s
                                        - delay: 50ms
                                        - voice_assistant.start
      - timing: # double click
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at least 0.25s
        then:
          - event.trigger:
              id: button_press_event
              event_type: "double_press"
      - timing: # triple click
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at least 0.25s
        then:
          - event.trigger:
              id: button_press_event
              event_type: "triple_press"
      - timing: # long press, reset everything
          - ON for 1s to 3s
          - OFF for at least 0.25s
        then:
          - logger.log: "Long Press - Resetting components"
          - light.turn_on:
              id: top_led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 100%
              effect: pulse
          - voice_assistant.stop
          - micro_wake_word.stop
          - media_player.stop:
              id: nabu
          - media_player.stop:
              id: sendspin_group_media_player
          - mixer_speaker.apply_ducking:
              id: media_spk_mixer_input
              decibel_reduction: 0
              duration: 0.0s
          - delay: 500ms
          - wait_until:
              condition:
                not:
                  speaker.is_playing:
                    id: onju_out
              timeout: 3s
          - lambda: id(led_state) = "idle";
          - script.execute: controle_leds
          - delay: 100ms
          - if:
              condition:
                and:
                  - switch.is_on: use_wake_word
                  - switch.is_off: master_mute_switch
              then:
                - micro_wake_word.start
          - event.trigger:
              id: button_press_event
              event_type: "long_press"

  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
    icon: mdi:microphone-message-off
    name: "Muted (Hardware Switch)"
    on_press:
      - if:
          condition:
            - switch.is_off: master_mute_switch
          then:
            - media_player.play_media:
                id: nabu
                media_url: "audio-file://mute"
                announcement: true
            - wait_until:
                condition:
                  speaker.is_playing:
                    id: announcement_spk_resampling_input
                timeout: 2s
            - wait_until:
                condition:
                  not:
                    speaker.is_playing:
                      id: announcement_spk_resampling_input
                timeout: 3s
            - script.execute: turn_off_wake_word
      - script.execute: turn_off_wake_word
    on_release:
      - media_player.play_media:
          id: nabu
          media_url: "audio-file://unmute"
          announcement: true
      - wait_until:
          condition:
            speaker.is_playing:
              id: announcement_spk_resampling_input
          timeout: 2s
      - wait_until:
          condition:
            not:
              speaker.is_playing:
                id: announcement_spk_resampling_input
          timeout: 3s
      - delay: 100ms
      - switch.turn_off: master_mute_switch
      - script.execute: turn_on_wake_word

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    disabled_by_default: true
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    disabled_by_default: true

debug:
text_sensor:
  - platform: debug
    reset_reason:
      name: "Restart Reason"
      disabled_by_default: true

event:
  # Event entity exposed to the user to automate on complex center button presses.
  # The simple press is not exposed as it is used to control the device itself.
  - platform: template
    id: button_press_event
    name: "Button press"
    icon: mdi:button-pointer
    device_class: button
    event_types:
      - double_press
      - triple_press
      - long_press

light:
  - platform: esp32_rmt_led_strip
    id: leds
    pin: GPIO11
    chipset: SK6812
    num_leds: 6
    channel_colors: GRB # replaces the deprecated rgb_order (removed in 2027.3.0)
    default_transition_length: 0s
    gamma_correct: 2.8
  - platform: partition
    id: left_led
    segments:
      - id: leds
        from: 0
        to: 0
    default_transition_length: 100ms
  - platform: partition
    id: top_led
    segments:
      - id: leds
        from: 1
        to: 4
    default_transition_length: 100ms
    effects:
      - pulse:
          name: pulse
          transition_length: 250ms
          update_interval: 250ms
      - addressable_scan:
          name: booting
          move_interval: 100ms
          scan_width: 1
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s
      - pulse:
          name: timer_pulse
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - addressable_twinkle:
          name: listening_ww
          twinkle_probability: 1%
      - pulse:
          name: listening
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - addressable_scan:
          name: thinking
          move_interval: 80ms
          scan_width: 1
      - pulse:
          name: speaking
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 90%
      - addressable_random_twinkle:
          name: random_twinkle
          twinkle_probability: 1%
      - strobe:
          name: alarm_strobe
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 200ms
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 200ms
      - addressable_lambda:
          name: show_volume
          update_interval: 50ms
          lambda: |-
            int int_volume = int(id(nabu).volume * 100.0f * it.size());
            int full_leds = int_volume / 100;
            int last_brightness = int_volume % 100;
            int i = 0;
            for(; i < full_leds; i++) {
              it[i] = Color::WHITE;
            }
            if(i < 4) {
              it[i++] = Color(64, 64, 64).fade_to_white(last_brightness*256/100);
            }
            for(; i < it.size(); i++) {
              it[i] = Color(64, 64, 64);
            }
  - platform: partition
    id: right_led
    segments:
      - id: leds
        from: 5
        to: 5
    default_transition_length: 100ms

script:
  - id: controle_leds
    then:
      - if:
          condition:
            lambda: return id(booted);
          then:
            - if:
                condition:
                  lambda: return id(led_state) == "idle";
                then:
                  - script.execute: check_if_timers_active
                  - if:
                      condition:
                        switch.is_on: master_mute_switch
                      then:
                        - light.turn_on:
                            id: top_led
                            red: 100%
                            green: 0%
                            blue: 5%
                            brightness: 30%
                            effect: "none"
                      else:
                        - if:
                            condition:
                              switch.is_off: use_wake_word
                            then:
                              - light.turn_on:
                                  id: top_led
                                  red: 40%
                                  green: 0%
                                  blue: 40%
                                  brightness: 30%
                                  effect: "none"
                            else:
                              - if:
                                  condition:
                                    and:
                                      - switch.is_on: flicker_wake_word
                                      - lambda: return id(internal_flicker);
                                  then:
                                    - if:
                                        condition:
                                          lambda: return id(is_timer_active);
                                        then:
                                          - light.turn_on:
                                              id: top_led
                                              blue: 100%
                                              red: 100%
                                              green: 0%
                                              brightness: 30%
                                              effect: listening_ww
                                        else:
                                          - light.turn_on:
                                              id: top_led
                                              blue: 100%
                                              red: 0%
                                              green: 100%
                                              brightness: 60%
                                              effect: listening_ww
                                  else:
                                    - light.turn_off: top_led
            - if:
                condition:
                  lambda: return id(led_state) == "listening";
                then:
                  - light.turn_on:
                      id: top_led
                      blue: 100%
                      red: 0%
                      green: 100%
                      brightness: 100%
                      effect: listening
            - if:
                condition:
                  lambda: return id(led_state) == "thinking";
                then:
                  - light.turn_on:
                      id: top_led
                      blue: 100%
                      red: 100%
                      green: 100%
                      brightness: 70%
                      effect: thinking
            - if:
                condition:
                  lambda: return id(led_state) == "replying";
                then:
                  - light.turn_on:
                      id: top_led
                      blue: 100%
                      red: 60%
                      green: 0%
                      effect: speaking
            - if:
                condition:
                  lambda: return id(led_state) == "error";
                then:
                  - light.turn_on:
                      id: top_led
                      blue: 0%
                      red: 100%
                      green: 0%
                      effect: none
            - if:
                condition:
                  lambda: return id(led_state) == "timer_ringing";
                then:
                  - light.turn_on:
                      id: top_led
                      blue: 0%
                      red: 100%
                      green: 100%
                      effect: timer_pulse
            - if:
                condition:
                  lambda: return id(led_state) == "connection_error";
                then:
                  - light.turn_on:
                      id: top_led
                      red: 100%
                      green: 0%
                      blue: 0%
                      effect: pulse
            - if:
                condition:
                  lambda: return id(led_state) == "alarm";
                then:
                  - light.turn_on:
                      id: top_led
                      effect: alarm_strobe

  - id: set_volume
    mode: restart
    parameters:
      volume: float
    then:
      - media_player.volume_set:
          id: nabu
          volume: !lambda return clamp(id(nabu).volume+volume, 0.0f, 1.0f);

  - id: show_volume
    mode: restart
    then:
      - light.turn_on:
          id: top_led
          effect: show_volume
      - delay: 1s
      - if:
          condition:
            and:
              - not:
                  switch.is_on: timer_ringing
              - not:
                  switch.is_on: alarm_siren
          then:
            - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

  - id: turn_on_wake_word
    then:
      - if:
          condition:
            and:
              - switch.is_off: master_mute_switch
              - switch.is_on: use_wake_word
          then:
            # NOTE no speaker.stop here (needed only for the single i2s bus): with duplex it would cut music/announcements
            - lambda: id(led_state) = "idle";
            - script.execute: controle_leds
            - micro_wake_word.start
          else:
            - logger.log:
                tag: "turn_on_wake_word"
                format: "Trying to start listening for wake word, but %s"
                args:
                  [
                    'id(hardware_mute_switch).state ? "mute switch is on" : "use wake word toggle is off"',
                  ]
                level: "INFO"

  - id: turn_off_wake_word
    then:
      - micro_wake_word.stop
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

  - id: ring_timer
    then:
      - lambda: id(old_volume_level) = id(nabu).volume;
      - media_player.volume_set:
          id: nabu
          volume: 70%
      - script.execute: repeating_ringing_timer
      - lambda: id(led_state) = "timer_ringing";
      - script.execute: controle_leds

  - id: repeating_ringing_timer
    then:
      - while:
          condition:
            - switch.is_on: timer_ringing
          then:
            - media_player.play_media:
                id: nabu
                media_url: "audio-file://timer_finished"
                announcement: true
            - wait_until:
                condition:
                  speaker.is_playing:
                    id: announcement_spk_resampling_input
                timeout: 2s
            - wait_until:
                condition:
                  not:
                    speaker.is_playing:
                      id: announcement_spk_resampling_input
                timeout: 10s
            - delay: 500ms

  - id: play_alarm_loop
    then:
      - while:
          condition:
            - switch.is_on: alarm_siren
          then:
            - media_player.play_media:
                id: nabu
                media_url: "${alarm_sound_url}"
            - wait_until:
                condition:
                  media_player.is_playing:
                    id: nabu
                timeout: 5s # HTTP stream start
            - wait_until:
                condition:
                  not:
                    media_player.is_playing:
                      id: nabu
                timeout: 60s
            - delay: 250ms

  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(is_timer_active) = output;

switch:
  - platform: esp_audio_stack # bypasses the whole AEC processor when off (useful for A/B tests)
    esp_audio_stack_id: i2s_shared
    aec:
      id: aec_switch
      name: "Echo Cancellation"
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON
  # This is the master mute switch. It is exposed to Home Assistant. The user can only turn it on and off if the hardware switch is off. (The hardware switch overrides the software one)
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute Microphone
    entity_category: ""
    lambda: |-
      // Muted either if the hardware mute switch is on or the microphone's software mute switch is enabled
      if (id(hardware_mute_switch).state || id(i2s_mics).get_mute_state()) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.mute:
                id: i2s_mics
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.unmute:
                id: i2s_mics
    on_turn_on:
      - lambda: id(led_state) = "idle"; # idle handles checking the mute switch
      - script.execute: controle_leds
    on_turn_off:
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds
  - platform: template
    name: Use Wake Word
    id: use_wake_word
    icon: mdi:microphone-message
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: turn_on_wake_word
    on_turn_off:
      - script.execute: turn_off_wake_word
  - platform: template
    name: Wake Word Listening Light
    id: flicker_wake_word
    icon: mdi:microphone-settings
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: id(internal_flicker) = true;
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds
    on_turn_off:
      - lambda: id(internal_flicker) = false;
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds
  - platform: gpio
    id: dac_mute
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: True

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      # Stop any current annoucement (ie: stop the timer ring mid playback)
      - if:
          condition:
            media_player.is_announcing:
              id: nabu
          then:
            media_player.stop:
              id: nabu
              announcement: true
      # Set back ducking ratio to zero
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 0
          duration: 1.0s
      - media_player.volume_set:
          id: nabu
          volume: !lambda return id(old_volume_level);
      - lambda: id(internal_flicker) = true;
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds
    on_turn_on:
      # Duck audio
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 30
          duration: 0.0s
      # Ring timer
      - script.execute: ring_timer
      - lambda: id(led_state) = "timer_ringing";
      - script.execute: controle_leds
      # If 15 minutes have passed and the timer is still ringing, stop it.
      # TODO known issue: re-triggering does not cancel a pending delay (each turn_on runs in parallel). If a second timer
      # rings within 15min after the first one, the first run's delay turns the second one off early.
      # Fix: move delay + turn_off into a script with mode: restart, execute it here and stop it in on_turn_off.
      - delay: 15min
      - switch.turn_off: timer_ringing
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

  - platform: template
    name: "Alarm Siren"
    id: alarm_siren
    icon: mdi:alarm-light
    entity_category: ""
    optimistic: true
    restore_mode: ALWAYS_OFF # never restart the siren after a reboot/power loss
    on_turn_on:
      # Save volume
      - lambda: id(old_volume_level) = id(nabu).volume;
      - media_player.volume_set:
          id: nabu
          volume: 1.0
      - script.execute: play_alarm_loop
      - lambda: id(led_state) = "alarm";
      - script.execute: controle_leds
      # Timeout 5 minutes
      # TODO known issue: same as timer_ringing - a pending delay from an earlier turn_on can switch a new alarm off early.
      # Fix: move delay + turn_off into a script with mode: restart.
      - delay: 5min
      - switch.turn_off: alarm_siren
    on_turn_off:
      - if:
          condition:
            media_player.is_playing:
              id: nabu
          then:
            media_player.stop:
              id: nabu
      - media_player.volume_set:
          id: nabu
          volume: !lambda return id(old_volume_level);
      - lambda: id(internal_flicker) = true;
      - lambda: id(led_state) = "idle";
      - script.execute: controle_leds

  # Show the volume LEDs also for volume changes from HA / Music Assistant (touch buttons always show it)
  - platform: template
    id: show_remote_volume_led_switch
    name: "LED bei Remote-Lautstaerke"
    icon: "mdi:volume-vibrate"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Pulse the LEDs red on WiFi/API connection loss
  - platform: template
    id: show_connection_error_led_switch
    name: "Blinken bei Verbindungsfehler"
    icon: "mdi:wifi-alert"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
